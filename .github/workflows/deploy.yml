name: Deploy to Hetzner

on:
    push:
        branches:
            - develop
            - main
    workflow_dispatch:

concurrency:
    group: deploy-${{ github.ref }}
    cancel-in-progress: false

env:
    SSH_OPTS: -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null

jobs:
    deploy:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup SSH key
              run: |
                  install -m 600 -D /dev/null ~/.ssh/deploy_key
                  echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key

            - name: Copy code to server
              run: |
                  rsync -az --delete \
                    --exclude=node_modules \
                    --exclude=.git \
                    --exclude=.env \
                    -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.HETZNER_PORT || 22 }} $SSH_OPTS" \
                    ./ ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}:~/element-web/

            - name: Build and deploy
              run: |
                  ssh -i ~/.ssh/deploy_key -p ${{ secrets.HETZNER_PORT || 22 }} $SSH_OPTS \
                    ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} bash -s << 'REMOTE'
                  set -e
                  cd ~/element-web

                  echo "[$(date)] Starting deployment..." >> deployment.log

                  # Stop existing Element services only
                  docker compose down --remove-orphans 2>/dev/null || true
                  sleep 3

                  # Build and start
                  docker compose build
                  docker compose up -d

                  # Wait for services to initialize
                  sleep 15

                  # Health checks
                  echo "Checking container status..."
                  docker compose ps

                  echo "Verifying Element Web..."
                  docker exec element-web wget -q --spider http://localhost:${ELEMENT_WEB_PORT:-8088}/config.json
                  echo "✓ Element Web is healthy"

                  echo "Verifying Bot Server..."
                  docker exec dynamic-room-bot curl -sf http://localhost:${BUNDLE_PORT:-3002}/health
                  echo "✓ Bot Server is healthy"

                  echo "[$(date)] Deployment successful!" >> deployment.log
                  REMOTE

            - name: Rollback on failure
              if: failure()
              run: |
                  ssh -i ~/.ssh/deploy_key -p ${{ secrets.HETZNER_PORT || 22 }} $SSH_OPTS \
                    ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} bash -s << 'REMOTE'
                  cd ~/element-web || exit 0
                  echo "[$(date)] Deployment failed, rolling back..." >> deployment.log
                  docker compose down 2>/dev/null || true
                  LATEST_BACKUP=$(ls -t .env.backup.* 2>/dev/null | head -1)
                  if [ -n "$LATEST_BACKUP" ]; then
                      cp "$LATEST_BACKUP" .env
                      docker compose up -d
                      echo "[$(date)] Rollback completed" >> deployment.log
                  fi
                  REMOTE
