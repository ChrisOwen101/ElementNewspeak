<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kanban Board</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #15191E;
            color: #F4F4F5;
            padding: 16px;
            height: 100vh;
            overflow: hidden;
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            gap: 12px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            flex: 1;
        }

        .header-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .add-card-input {
            display: flex;
            gap: 8px;
            padding: 8px;
            background: #1E2328;
            border: 1px solid #3D4249;
            border-radius: 4px;
            align-items: center;
        }

        .add-card-input input {
            flex: 1;
            background: transparent;
            border: none;
            color: #F4F4F5;
            font-size: 14px;
            outline: none;
            min-width: 120px;
        }

        .add-card-input input::placeholder {
            color: #8D8D92;
        }

        button {
            padding: 8px 12px;
            background: #0DBF60;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #0AA052;
        }

        button:active {
            background: #089D4E;
        }

        button.danger {
            background: #D71C1C;
        }

        button.danger:hover {
            background: #B31717;
        }

        .columns-container {
            display: flex;
            gap: 16px;
            flex: 1;
            overflow-x: auto;
            overflow-y: hidden;
            padding-bottom: 8px;
        }

        .column {
            display: flex;
            flex-direction: column;
            background: #1E2328;
            border-radius: 8px;
            width: 320px;
            flex-shrink: 0;
            border: 1px solid #3D4249;
            overflow: hidden;
        }

        .column-header {
            padding: 12px 16px;
            border-bottom: 1px solid #3D4249;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .column-count {
            display: inline-block;
            background: #2E3338;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 12px;
            color: #8D8D92;
            margin-left: 8px;
        }

        .cards-container {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card {
            background: #242A31;
            border: 1px solid #3D4249;
            border-radius: 6px;
            padding: 12px;
            cursor: move;
            transition: all 0.2s;
            user-select: none;
        }

        .card:hover {
            border-color: #4E5561;
            background: #2A3137;
        }

        .card.dragging {
            opacity: 0.5;
            transform: scale(0.95);
        }

        .card.drag-over {
            border-color: #0DBF60;
            background: #1a2621;
        }

        .card-title {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            word-break: break-word;
            color: #F4F4F5;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #8D8D92;
        }

        .card-author {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .card-actions {
            display: flex;
            gap: 4px;
        }

        .card-actions button {
            padding: 4px 8px;
            font-size: 12px;
            background: #2E3338;
            color: #F4F4F5;
        }

        .card-actions button:hover {
            background: #3D4249;
        }

        .card-actions button.delete {
            background: #D71C1C;
            color: white;
        }

        .card-actions button.delete:hover {
            background: #B31717;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 32px;
            text-align: center;
            color: #8D8D92;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .empty-state-text {
            font-size: 14px;
            line-height: 1.5;
        }

        .empty-state-text strong {
            display: block;
            color: #F4F4F5;
            margin-bottom: 4px;
        }

        /* Scrollbar styling */
        .cards-container::-webkit-scrollbar,
        .columns-container::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        .cards-container::-webkit-scrollbar-track,
        .columns-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .cards-container::-webkit-scrollbar-thumb,
        .columns-container::-webkit-scrollbar-thumb {
            background: #3D4249;
            border-radius: 4px;
        }

        .cards-container::-webkit-scrollbar-thumb:hover,
        .columns-container::-webkit-scrollbar-thumb:hover {
            background: #4E5561;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        // Application state
        let currentRoom = { messages: [], roomState: {} };
        let draggedCard = null;
        let draggedFromColumn = null;

        // Column definitions
        const COLUMNS = [
            { id: 'todo', label: 'To Do' },
            { id: 'in-progress', label: 'In Progress' },
            { id: 'in-review', label: 'In Review' },
            { id: 'done', label: 'Done' }
        ];

        // Extract cards from messages
        function getCards(messages) {
            const cards = new Map();

            for (const msg of messages) {
                if (msg.type === 'io.element.kanban.card') {
                    cards.set(msg.eventId, {
                        id: msg.eventId,
                        title: msg.content.title,
                        column: msg.content.column,
                        author: msg.senderDisplayName || msg.sender,
                        createdAt: msg.timestamp,
                    });
                } else if (msg.type === 'io.element.kanban.card_delete') {
                    cards.delete(msg.content.targetEventId);
                } else if (msg.type === 'io.element.kanban.card_move') {
                    const card = cards.get(msg.content.targetEventId);
                    if (card) {
                        cards.set(msg.content.targetEventId, {
                            ...card,
                            column: msg.content.column
                        });
                    }
                }
            }

            return [...cards.values()];
        }

        // Render the kanban board
        function render(messages, roomState) {
            const cards = getCards(messages);
            const app = document.getElementById('app');

            let html = `
                <div class="header">
                    <h1>📋 Kanban Board</h1>
                    <div class="header-controls">
                        <div class="add-card-input">
                            <input
                                type="text"
                                id="new-card-input"
                                placeholder="Add a new card..."
                                autocomplete="off"
                            >
                            <button onclick="addCard()">Add</button>
                        </div>
                    </div>
                </div>
                <div class="columns-container">
            `;

            if (cards.length === 0) {
                html += `
                    <div class="empty-state">
                        <div class="empty-state-icon">📌</div>
                        <div class="empty-state-text">
                            <strong>No cards yet</strong>
                            Add your first card to get started!
                        </div>
                    </div>
                </div>
                `;
            } else {
                for (const column of COLUMNS) {
                    const columnCards = cards.filter(c => c.column === column.id);

                    html += `
                        <div class="column">
                            <div class="column-header">
                                <span>${column.label}<span class="column-count">${columnCards.length}</span></span>
                            </div>
                            <div class="cards-container" data-column="${column.id}" ondrop="handleDrop(event)" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)">
                    `;

                    if (columnCards.length === 0) {
                        html += `<div class="empty-state"><div class="empty-state-text" style="color: #3D4249;">Drop cards here</div></div>`;
                    } else {
                        for (const card of columnCards) {
                            html += `
                                <div
                                    class="card"
                                    draggable="true"
                                    data-card-id="${card.id}"
                                    ondragstart="handleDragStart(event, '${column.id}')"
                                    ondragend="handleDragEnd(event)"
                                >
                                    <div class="card-title">${escapeHtml(card.title)}</div>
                                    <div class="card-meta">
                                        <div class="card-author">${escapeHtml(card.author)}</div>
                                        <div class="card-actions">
                                            <button class="delete" onclick="deleteCard('${card.id}')">Delete</button>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }
                    }

                    html += `
                            </div>
                        </div>
                    `;
                }
            }

            html += `</div>`;

            app.innerHTML = html;

            // Attach input listener to new-card-input if it exists
            const input = document.getElementById('new-card-input');
            if (input) {
                input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        addCard();
                    }
                });
            }
        }

        // Add a new card to the "To Do" column
        function addCard() {
            const input = document.getElementById('new-card-input');
            const title = input?.value?.trim();

            if (!title) return;

            parent.postMessage({
                type: 'ACTION_SEND_EVENT',
                eventType: 'io.element.kanban.card',
                content: {
                    title: title,
                    column: 'todo'
                }
            }, '*');

            if (input) {
                input.value = '';
                input.focus();
            }
        }

        // Delete a card
        function deleteCard(cardId) {
            parent.postMessage({
                type: 'ACTION_SEND_EVENT',
                eventType: 'io.element.kanban.card_delete',
                content: {
                    targetEventId: cardId
                }
            }, '*');
        }

        // Drag and drop handlers
        function handleDragStart(event, fromColumn) {
            draggedCard = event.target.closest('.card');
            draggedFromColumn = fromColumn;
            draggedCard.classList.add('dragging');
            event.dataTransfer.effectAllowed = 'move';
        }

        function handleDragEnd(event) {
            if (draggedCard) {
                draggedCard.classList.remove('dragging');
            }
            document.querySelectorAll('.cards-container').forEach(container => {
                container.classList.remove('drag-over');
            });
            draggedCard = null;
            draggedFromColumn = null;
        }

        function handleDragOver(event) {
            event.preventDefault();
            event.dataTransfer.dropEffect = 'move';
            event.currentTarget.classList.add('drag-over');
        }

        function handleDragLeave(event) {
            if (event.currentTarget === event.target) {
                event.currentTarget.classList.remove('drag-over');
            }
        }

        function handleDrop(event) {
            event.preventDefault();
            event.currentTarget.classList.remove('drag-over');

            if (!draggedCard) return;

            const toColumn = event.currentTarget.dataset.column;
            const cardId = draggedCard.dataset.cardId;

            if (cardId && toColumn) {
                parent.postMessage({
                    type: 'ACTION_SEND_EVENT',
                    eventType: 'io.element.kanban.card_move',
                    content: {
                        targetEventId: cardId,
                        column: toColumn
                    }
                }, '*');
            }
        }

        // Utility function to escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Listen for room data updates
        window.addEventListener('message', (event) => {
            if (event.data.type === 'ROOM_DATA') {
                currentRoom = event.data;
                render(event.data.messages, event.data.roomState);
            }
        });

        // Initial render with empty state
        render([], {});
    </script>
</body>
</html>
