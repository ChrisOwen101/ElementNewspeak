<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Collaborative Countdown Timer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #15191E;
      color: #F4F4F5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    /* ── Header ────────────────────────────────────────────── */
    .header {
      padding: 10px 16px;
      border-bottom: 1px solid #1F262F;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .header-title {
      font-size: 13px;
      font-weight: 600;
      color: #8391A0;
      display: flex;
      align-items: center;
      gap: 7px;
      letter-spacing: 0.2px;
    }

    .header-room {
      font-size: 12px;
      color: #4D5966;
      max-width: 160px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Main ──────────────────────────────────────────────── */
    .main {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px 16px;
      gap: 18px;
    }

    /* ── Ring ──────────────────────────────────────────────── */
    .timer-wrap {
      position: relative;
      flex-shrink: 0;
    }

    .timer-svg {
      transform: rotate(-90deg);
      display: block;
    }

    .ring-track {
      fill: none;
      stroke: #1F262F;
      stroke-width: 10;
    }

    .ring-glow {
      fill: none;
      stroke-width: 22;
      stroke-linecap: round;
      opacity: 0.07;
    }

    .ring-arc {
      fill: none;
      stroke-width: 10;
      stroke-linecap: round;
    }

    .timer-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .timer-digits {
      font-size: 44px;
      font-weight: 200;
      letter-spacing: 4px;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      transition: color 0.5s ease;
    }

    .timer-name {
      font-size: 12px;
      color: #5E6B78;
      margin-top: 7px;
      max-width: 145px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Status badge ──────────────────────────────────────── */
    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.9px;
      text-transform: uppercase;
      transition: background 0.4s ease, color 0.4s ease;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
      transition: background 0.4s ease;
    }

    .status.running  { background: rgba(13,189,139,0.12); color: #0DBD8B; }
    .status.running .status-dot  { background: #0DBD8B; animation: blink 1.4s ease-in-out infinite; }
    .status.paused   { background: rgba(250,204,21,0.12); color: #FACC15; }
    .status.paused .status-dot   { background: #FACC15; }
    .status.stopped  { background: rgba(142,152,163,0.10); color: #8391A0; }
    .status.stopped .status-dot  { background: #8391A0; }
    .status.finished { background: rgba(248,113,113,0.12); color: #F87171; }
    .status.finished .status-dot { background: #F87171; animation: blink 0.65s ease-in-out infinite; }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.1; }
    }

    /* ── Controls ──────────────────────────────────────────── */
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 500;
      transition: filter 0.15s, transform 0.1s, opacity 0.15s;
      outline: none;
      user-select: none;
    }

    .btn:hover:not(:disabled) { filter: brightness(1.15); }
    .btn:active:not(:disabled) { transform: scale(0.95); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .btn-start {
      background: #0DBD8B;
      color: #fff;
      padding: 11px 30px;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 7px;
      letter-spacing: 0.2px;
    }

    .btn-pause {
      background: rgba(250,204,21,0.13);
      color: #FACC15;
      border: 1px solid rgba(250,204,21,0.28);
      padding: 11px 26px;
      font-size: 15px;
    }

    .btn-reset {
      background: #1A2029;
      color: #8391A0;
      border: 1px solid #1F262F;
      padding: 11px 17px;
      font-size: 15px;
      border-radius: 8px;
    }

    .btn-set {
      background: transparent;
      color: #4D5966;
      border: 1px dashed #28313C;
      padding: 9px 14px;
      font-size: 13px;
      border-radius: 8px;
      transition: color 0.15s, border-color 0.15s;
    }

    .btn-set:hover { color: #8391A0; border-color: #4D5966; filter: none; }

    /* ── Activity Log ──────────────────────────────────────── */
    .log {
      width: 100%;
      max-width: 360px;
    }

    .log-heading {
      font-size: 10px;
      font-weight: 600;
      color: #4D5966;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    .log-entries {
      display: flex;
      flex-direction: column;
      gap: 3px;
      max-height: 110px;
      overflow-y: auto;
    }

    .log-entry {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 5px 9px;
      background: #191F27;
      border-radius: 5px;
      font-size: 12px;
      color: #7D8A96;
    }

    .log-time {
      font-size: 10px;
      color: #4D5966;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── Empty state ───────────────────────────────────────── */
    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
      padding: 8px 16px;
    }

    .empty-icon {
      font-size: 58px;
      line-height: 1;
      filter: grayscale(0.2);
    }

    .empty h2 {
      font-size: 19px;
      font-weight: 500;
      color: #F4F4F5;
    }

    .empty p {
      font-size: 13px;
      color: #4D5966;
      max-width: 270px;
      line-height: 1.65;
    }

    /* ── Modal ─────────────────────────────────────────────── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.68);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .modal {
      background: #1A2029;
      border: 1px solid #1F262F;
      border-radius: 14px;
      padding: 24px;
      width: min(390px, calc(100vw - 32px));
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
    }

    .modal-title {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #F4F4F5;
    }

    .field { margin-bottom: 16px; }

    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #8391A0;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    .field-input {
      width: 100%;
      background: #15191E;
      border: 1px solid #1F262F;
      border-radius: 7px;
      padding: 9px 12px;
      color: #F4F4F5;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }

    .field-input:focus { border-color: #0DBD8B; }

    /* Presets */
    .presets {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .preset-btn {
      background: #15191E;
      border: 1px solid #1F262F;
      border-radius: 6px;
      color: #7D8A96;
      font-size: 12px;
      padding: 5px 11px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .preset-btn:hover {
      background: #1F262F;
      color: #F4F4F5;
      border-color: #28313C;
    }

    /* Duration row */
    .dur-row {
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    .dur-field { flex: 1; }

    .dur-input {
      width: 100%;
      background: #15191E;
      border: 1px solid #1F262F;
      border-radius: 7px;
      padding: 10px 6px;
      color: #F4F4F5;
      font-size: 30px;
      font-weight: 200;
      text-align: center;
      font-family: inherit;
      outline: none;
      font-variant-numeric: tabular-nums;
      transition: border-color 0.15s;
    }

    .dur-input:focus { border-color: #0DBD8B; }

    .dur-unit {
      font-size: 10px;
      color: #4D5966;
      text-align: center;
      margin-top: 5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .dur-sep {
      font-size: 28px;
      color: #1F262F;
      padding-top: 9px;
      flex-shrink: 0;
      font-weight: 300;
    }

    .modal-footer {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 22px;
    }

    .btn-cancel {
      background: #15191E;
      border: 1px solid #1F262F;
      color: #8391A0;
      padding: 9px 18px;
      font-size: 14px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      transition: filter 0.15s;
    }

    .btn-cancel:hover { filter: brightness(1.15); }

    .btn-confirm {
      background: #0DBD8B;
      color: #fff;
      padding: 9px 22px;
      font-size: 14px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 500;
      border: none;
      transition: filter 0.15s;
    }

    .btn-confirm:hover { filter: brightness(1.1); }

    /* Finished flash on digits */
    .digits-finished {
      animation: digitsFlash 0.6s ease-in-out infinite;
    }

    @keyframes digitsFlash {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    /* Helpers */
    .hidden { display: none !important; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #1F262F; border-radius: 2px; }

    /* Number spinner styling */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { opacity: 1; }
  </style>
</head>
<body>
<div id="app">
  <header class="header">
    <div class="header-title">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
      </svg>
      Countdown Timer
    </div>
    <div class="header-room" id="room-name"></div>
  </header>
  <main class="main" id="main"></main>
</div>

<!-- Modal -->
<div class="overlay hidden" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-heading">
    <div class="modal-title" id="modal-heading">Set Timer</div>

    <div class="field">
      <label class="field-label" for="inp-name">Timer Name</label>
      <input class="field-input" id="inp-name" type="text"
             placeholder="e.g. Sprint Review, Standup, Break…" maxlength="60" autocomplete="off">
    </div>

    <div class="field">
      <span class="field-label">Quick Presets</span>
      <div class="presets" id="presets">
        <button class="preset-btn" data-s="60">1 min</button>
        <button class="preset-btn" data-s="180">3 min</button>
        <button class="preset-btn" data-s="300">5 min</button>
        <button class="preset-btn" data-s="600">10 min</button>
        <button class="preset-btn" data-s="900">15 min</button>
        <button class="preset-btn" data-s="1800">30 min</button>
        <button class="preset-btn" data-s="3600">1 hr</button>
      </div>
    </div>

    <div class="field">
      <span class="field-label">Custom Duration</span>
      <div class="dur-row">
        <div class="dur-field">
          <input class="dur-input" id="inp-h" type="number" min="0" max="23" value="0">
          <div class="dur-unit">Hours</div>
        </div>
        <div class="dur-sep">:</div>
        <div class="dur-field">
          <input class="dur-input" id="inp-m" type="number" min="0" max="59" value="5">
          <div class="dur-unit">Mins</div>
        </div>
        <div class="dur-sep">:</div>
        <div class="dur-field">
          <input class="dur-input" id="inp-s" type="number" min="0" max="59" value="0">
          <div class="dur-unit">Secs</div>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-cancel" id="btn-cancel">Cancel</button>
      <button class="btn-confirm" id="btn-confirm">Set Timer</button>
    </div>
  </div>
</div>

<script>
'use strict';

/* ── Constants ──────────────────────────────────────────────── */
const TIMER_EVT  = 'io.element.countdown.timer';
const ACTION_EVT = 'io.element.countdown.action';

// SVG ring geometry
const R    = 82;
const CIRC = 2 * Math.PI * R;
const SZ   = 210;
const CX   = SZ / 2;

/* ── App state ──────────────────────────────────────────────── */
let appState   = null;   // last derived state
let tickHandle = null;   // setInterval ID

/* ══════════════════════════════════════════════════════════════
   Utility
══════════════════════════════════════════════════════════════ */

function esc(s) {
  const d = document.createElement('div');
  d.textContent = String(s ?? '');
  return d.innerHTML;
}

function fmtTime(secs) {
  const t = Math.max(0, Math.floor(secs));
  const h = Math.floor(t / 3600);
  const m = Math.floor((t % 3600) / 60);
  const s = t % 60;
  return h > 0
    ? `${pad(h)}:${pad(m)}:${pad(s)}`
    : `${pad(m)}:${pad(s)}`;
}

function pad(n) { return String(n).padStart(2, '0'); }

function fmtHHMM(ts) {
  return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

/* ══════════════════════════════════════════════════════════════
   State derivation from Matrix events
══════════════════════════════════════════════════════════════ */

function deriveState(messages) {
  let cfg     = null;
  let actions = [];

  for (const m of messages) {
    if (m.type === TIMER_EVT) {
      cfg = {
        id:       m.eventId,
        name:     m.content.name     || 'Timer',
        duration: Number(m.content.duration) || 300,
        author:   m.senderDisplayName,
        ts:       m.timestamp,
      };
      actions = [];   // fresh slate on new config
    } else if (m.type === ACTION_EVT && cfg) {
      actions.push({
        action: m.content.action,
        rem:    Number(m.content.remainingSeconds) || 0,
        author: m.senderDisplayName,
        ts:     m.timestamp,   // server-assigned timestamp = clock sync
      });
    }
  }

  if (!cfg) return null;

  const log = [{ text: `${cfg.author} created "${cfg.name}"`, ts: cfg.ts }];

  let status   = 'stopped';
  let remaining = cfg.duration;
  let startedAt = null;
  let remAtStart = cfg.duration;

  for (const a of actions) {
    if (a.action === 'start') {
      status     = 'running';
      startedAt  = a.ts;
      remAtStart = a.rem;
      remaining  = a.rem;
      log.push({ text: `${a.author} started the timer`, ts: a.ts });
    } else if (a.action === 'pause') {
      status     = 'paused';
      remaining  = a.rem;
      remAtStart = a.rem;
      startedAt  = null;
      log.push({ text: `${a.author} paused the timer`, ts: a.ts });
    } else if (a.action === 'reset') {
      status     = 'stopped';
      remaining  = cfg.duration;
      remAtStart = cfg.duration;
      startedAt  = null;
      log.push({ text: `${a.author} reset the timer`, ts: a.ts });
    }
  }

  // Compute live remaining when running
  if (status === 'running' && startedAt !== null) {
    const elapsed = (Date.now() - startedAt) / 1000;
    remaining = Math.max(0, remAtStart - elapsed);
    if (remaining === 0) status = 'finished';
  }

  return { cfgId: cfg.id, name: cfg.name, duration: cfg.duration,
           remaining, status, startedAt, remAtStart, log };
}

/* ══════════════════════════════════════════════════════════════
   Ring helpers
══════════════════════════════════════════════════════════════ */

function liveRemaining(st) {
  if (st.status !== 'running' || st.startedAt === null) return st.remaining;
  const elapsed = (Date.now() - st.startedAt) / 1000;
  return Math.max(0, st.remAtStart - elapsed);
}

function ringColor(rem, dur) {
  if (!dur) return '#0DBD8B';
  const r = rem / dur;
  if (r > 0.5)  return '#0DBD8B';   // green
  if (r > 0.25) return '#FACC15';   // yellow
  if (r > 0.08) return '#FB923C';   // orange
  return '#F87171';                  // red
}

function ringOffset(rem, dur) {
  return CIRC * (1 - (dur ? Math.min(1, rem / dur) : 0));
}

/* ══════════════════════════════════════════════════════════════
   Full render (called on every ROOM_DATA)
══════════════════════════════════════════════════════════════ */

function render(messages, roomState) {
  appState = deriveState(messages);

  // Room name in header
  const roomEl = document.getElementById('room-name');
  if (roomEl) roomEl.textContent = roomState?.roomName || '';

  const main = document.getElementById('main');

  /* ── Empty state ── */
  if (!appState) {
    stopTick();
    main.innerHTML = `
      <div class="empty">
        <div class="empty-icon">⏱️</div>
        <h2>No Timer Set</h2>
        <p>Create a shared countdown timer that everyone in this room can see and control together.</p>
        <button class="btn btn-start" style="margin-top:6px;border-radius:8px" onclick="openModal()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Set Timer
        </button>
      </div>`;
    return;
  }

  /* ── Timer UI ── */
  const st   = appState;
  const rem  = liveRemaining(st);
  const col  = ringColor(rem, st.duration);
  const off  = ringOffset(rem, st.duration);

  const statusLabels = {
    running:  'Running',
    paused:   'Paused',
    stopped:  'Ready',
    finished: 'Finished',
  };

  const recentLogs = [...st.log].reverse().slice(0, 5);

  const digitClass = st.status === 'finished' ? 'timer-digits digits-finished' : 'timer-digits';

  main.innerHTML = `
    <!-- Ring -->
    <div class="timer-wrap">
      <svg class="timer-svg" width="${SZ}" height="${SZ}" viewBox="0 0 ${SZ} ${SZ}">
        <circle class="ring-track" cx="${CX}" cy="${CX}" r="${R}"/>
        <circle class="ring-glow" id="ring-glow"
          cx="${CX}" cy="${CX}" r="${R}"
          stroke="${col}"
          stroke-dasharray="${CIRC}"
          stroke-dashoffset="${off}"/>
        <circle class="ring-arc" id="ring-arc"
          cx="${CX}" cy="${CX}" r="${R}"
          stroke="${col}"
          stroke-dasharray="${CIRC}"
          stroke-dashoffset="${off}"/>
      </svg>
      <div class="timer-center">
        <div id="digits" class="${digitClass}" style="color:${col}">${fmtTime(rem)}</div>
        <div class="timer-name">${esc(st.name)}</div>
      </div>
    </div>

    <!-- Status -->
    <div class="status ${st.status}">
      <span class="status-dot"></span>
      ${statusLabels[st.status] || st.status}
    </div>

    <!-- Controls -->
    <div class="controls">
      ${buildControls(st, rem)}
      <button class="btn btn-set" onclick="openModal()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93l-1.41 1.41M4.93 4.93l1.41 1.41M19.07 19.07l-1.41-1.41M4.93 19.07l1.41-1.41M12 2v2M12 20v2M2 12h2M20 12h2"/></svg>Set…
      </button>
    </div>

    <!-- Activity log -->
    ${recentLogs.length ? `
      <div class="log">
        <div class="log-heading">Activity</div>
        <div class="log-entries">
          ${recentLogs.map(l => `
            <div class="log-entry">
              <span>${esc(l.text)}</span>
              <span class="log-time">${fmtHHMM(l.ts)}</span>
            </div>`).join('')}
        </div>
      </div>` : ''}
  `;

  // Tick management
  if (st.status === 'running') {
    startTick();
  } else {
    stopTick();
  }
}

function buildControls(st, rem) {
  if (st.status === 'running') {
    return `
      <button class="btn btn-pause" onclick="sendAction('pause')">⏸ Pause</button>
      <button class="btn btn-reset" onclick="sendAction('reset')" title="Reset">↺</button>`;
  }
  if (st.status === 'finished') {
    return `<button class="btn btn-start" onclick="sendAction('reset')">↺ Reset</button>`;
  }
  // stopped or paused
  const disabledAttr = rem <= 0 ? 'disabled' : '';
  const pausedReset = st.status === 'paused'
    ? `<button class="btn btn-reset" onclick="sendAction('reset')" title="Reset">↺</button>`
    : '';
  return `
    <button class="btn btn-start" onclick="sendAction('start')" ${disabledAttr}>▶ Start</button>
    ${pausedReset}`;
}

/* ══════════════════════════════════════════════════════════════
   Tick — update ring + digits every 100 ms while running
══════════════════════════════════════════════════════════════ */

function startTick() {
  if (tickHandle !== null) return;
  tickHandle = setInterval(updateTick, 100);
}

function stopTick() {
  if (tickHandle !== null) {
    clearInterval(tickHandle);
    tickHandle = null;
  }
}

function updateTick() {
  if (!appState || appState.status !== 'running') { stopTick(); return; }

  const rem = liveRemaining(appState);
  const col = ringColor(rem, appState.duration);
  const off = ringOffset(rem, appState.duration);

  const digitsEl = document.getElementById('digits');
  if (digitsEl) {
    digitsEl.textContent = fmtTime(rem);
    digitsEl.style.color = col;
  }

  const arcEl = document.getElementById('ring-arc');
  if (arcEl) {
    arcEl.setAttribute('stroke-dashoffset', off);
    arcEl.setAttribute('stroke', col);
  }

  const glowEl = document.getElementById('ring-glow');
  if (glowEl) {
    glowEl.setAttribute('stroke-dashoffset', off);
    glowEl.setAttribute('stroke', col);
  }

  // If naturally expired, stop ticking (next ROOM_DATA will re-render)
  if (rem <= 0) stopTick();
}

/* ══════════════════════════════════════════════════════════════
   Actions — post events to parent (Matrix)
══════════════════════════════════════════════════════════════ */

function sendAction(action) {
  if (!appState) return;

  let remainingSeconds;
  if (action === 'start') {
    remainingSeconds = appState.remaining;
  } else if (action === 'pause') {
    remainingSeconds = liveRemaining(appState);
  } else {
    remainingSeconds = appState.duration;   // reset
  }

  parent.postMessage({
    type: 'ACTION_SEND_EVENT',
    eventType: ACTION_EVT,
    content: { action, remainingSeconds },
  }, '*');
}

/* ══════════════════════════════════════════════════════════════
   Modal — Set Timer
══════════════════════════════════════════════════════════════ */

function openModal() {
  document.getElementById('overlay').classList.remove('hidden');

  if (appState) {
    document.getElementById('inp-name').value = appState.name;
    const d = Math.round(appState.duration);
    document.getElementById('inp-h').value = Math.floor(d / 3600);
    document.getElementById('inp-m').value = Math.floor((d % 3600) / 60);
    document.getElementById('inp-s').value = d % 60;
  } else {
    document.getElementById('inp-name').value = '';
    document.getElementById('inp-h').value = 0;
    document.getElementById('inp-m').value = 5;
    document.getElementById('inp-s').value = 0;
  }

  setTimeout(() => document.getElementById('inp-name').focus(), 60);
}

function closeModal() {
  document.getElementById('overlay').classList.add('hidden');
}

function confirmModal() {
  const name = document.getElementById('inp-name').value.trim() || 'Timer';
  const h    = Math.max(0, parseInt(document.getElementById('inp-h').value) || 0);
  const m    = Math.max(0, parseInt(document.getElementById('inp-m').value) || 0);
  const s    = Math.max(0, parseInt(document.getElementById('inp-s').value) || 0);
  const duration = h * 3600 + m * 60 + s;

  if (duration <= 0) {
    const mEl = document.getElementById('inp-m');
    mEl.style.borderColor = '#F87171';
    mEl.focus();
    setTimeout(() => { mEl.style.borderColor = ''; }, 1500);
    return;
  }

  parent.postMessage({
    type: 'ACTION_SEND_EVENT',
    eventType: TIMER_EVT,
    content: { name, duration },
  }, '*');

  closeModal();
}

/* ── Preset buttons ── */
document.getElementById('presets').addEventListener('click', e => {
  const btn = e.target.closest('.preset-btn');
  if (!btn) return;
  const secs = parseInt(btn.dataset.s, 10);
  document.getElementById('inp-h').value = Math.floor(secs / 3600);
  document.getElementById('inp-m').value = Math.floor((secs % 3600) / 60);
  document.getElementById('inp-s').value = secs % 60;
});

document.getElementById('btn-cancel').addEventListener('click', closeModal);
document.getElementById('btn-confirm').addEventListener('click', confirmModal);

document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('overlay')) closeModal();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && !document.getElementById('overlay').classList.contains('hidden')) {
    e.preventDefault();
    confirmModal();
  }
});

/* ══════════════════════════════════════════════════════════════
   Message bridge
══════════════════════════════════════════════════════════════ */

window.addEventListener('message', event => {
  if (event.data?.type === 'ROOM_DATA') {
    const { messages = [], roomState = {} } = event.data;
    render(messages, roomState);
  }
});

// Initial empty render while waiting for ROOM_DATA
render([], {});
</script>
</body>
</html>
