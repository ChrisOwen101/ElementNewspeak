<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Treasury Status</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #15191E;
            color: #F4F4F5;
            padding: 0;
            overflow: hidden;
        }

        #app {
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: 24px;
            overflow-y: auto;
        }

        .header {
            margin-bottom: 32px;
        }

        .title {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #F4F4F5;
        }

        .subtitle {
            font-size: 14px;
            color: #A0A9BA;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: linear-gradient(135deg, #1E2330 0%, #242D38 100%);
            border: 1px solid #3F4754;
            border-radius: 12px;
            padding: 24px;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            border-color: #5B6B82;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .stat-label {
            font-size: 13px;
            color: #A0A9BA;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: #F4F4F5;
            margin-bottom: 8px;
            word-break: break-word;
        }

        .stat-change {
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-change.positive {
            color: #31A24C;
        }

        .stat-change.negative {
            color: #E64C3C;
        }

        .stat-change.neutral {
            color: #A0A9BA;
        }

        .arrow {
            font-size: 16px;
        }

        .currency {
            font-size: 18px;
            color: #A0A9BA;
            margin-left: 4px;
        }

        .transactions-section {
            margin-top: 20px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #F4F4F5;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .transactions-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
        }

        .transaction-item {
            background: #1E2330;
            border: 1px solid #3F4754;
            border-radius: 8px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s ease;
        }

        .transaction-item:hover {
            background: #242D38;
        }

        .transaction-left {
            flex: 1;
        }

        .transaction-description {
            font-size: 14px;
            color: #F4F4F5;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .transaction-meta {
            font-size: 12px;
            color: #A0A9BA;
        }

        .transaction-amount {
            font-size: 16px;
            font-weight: 600;
            white-space: nowrap;
        }

        .transaction-amount.income {
            color: #31A24C;
        }

        .transaction-amount.expense {
            color: #E64C3C;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 64px 24px;
            text-align: center;
            color: #A0A9BA;
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #F4F4F5;
        }

        .empty-description {
            font-size: 14px;
            max-width: 400px;
            line-height: 1.5;
        }

        .add-transaction-section {
            margin-top: 32px;
            padding: 24px;
            background: linear-gradient(135deg, #1E2330 0%, #242D38 100%);
            border: 1px solid #3F4754;
            border-radius: 12px;
        }

        .form-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #F4F4F5;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 13px;
            color: #A0A9BA;
            margin-bottom: 6px;
            font-weight: 500;
        }

        input,
        select {
            width: 100%;
            padding: 10px 12px;
            background: #0F1217;
            border: 1px solid #3F4754;
            border-radius: 6px;
            color: #F4F4F5;
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.2s ease;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #5B6B82;
            box-shadow: 0 0 0 3px rgba(91, 107, 130, 0.1);
        }

        input::placeholder {
            color: #686F7A;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button {
            background: linear-gradient(135deg, #0DBF60 0%, #0A9650 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        button:hover {
            background: linear-gradient(135deg, #0AA854 0%, #088644 100%);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(13, 191, 96, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .error-message {
            color: #E64C3C;
            font-size: 13px;
            margin-top: 4px;
        }

        .scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .scrollbar::-webkit-scrollbar-thumb {
            background: #3F4754;
            border-radius: 3px;
        }

        .scrollbar::-webkit-scrollbar-thumb:hover {
            background: #5B6B82;
        }

        .transactions-list {
            scrollbar-color: #3F4754 transparent;
            scrollbar-width: thin;
        }

        #app {
            scrollbar-color: #3F4754 transparent;
            scrollbar-width: thin;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        class TreasuryComponent {
            constructor() {
                this.messages = [];
                this.roomState = {};
                this.errorMessage = '';
                this.setupEventListener();
            }

            setupEventListener() {
                window.addEventListener('message', (event) => {
                    if (event.data.type === 'ROOM_DATA') {
                        this.messages = event.data.messages || [];
                        this.roomState = event.data.roomState || {};
                        this.errorMessage = '';
                        this.render();
                    }
                });
            }

            getTreasuryTransactions() {
                // Extract all treasury transactions from room events
                const transactions = [];

                for (const msg of this.messages) {
                    if (msg.type === 'io.element.treasury.transaction') {
                        transactions.push({
                            id: msg.eventId,
                            description: msg.content.description || '',
                            amount: msg.content.amount || 0,
                            type: msg.content.transactionType || 'expense', // 'income' or 'expense'
                            currency: msg.content.currency || 'USD',
                            timestamp: msg.timestamp,
                            sender: msg.senderDisplayName || msg.sender,
                            category: msg.content.category || 'Other'
                        });
                    }
                }

                // Sort by timestamp descending (newest first)
                return transactions.sort((a, b) => b.timestamp - a.timestamp);
            }

            calculateStatistics() {
                const transactions = this.getTreasuryTransactions();

                let totalBalance = 0;
                let totalIncome = 0;
                let totalExpense = 0;
                let incomeCount = 0;
                let expenseCount = 0;

                for (const tx of transactions) {
                    if (tx.type === 'income') {
                        totalIncome += tx.amount;
                        incomeCount++;
                        totalBalance += tx.amount;
                    } else {
                        totalExpense += tx.amount;
                        expenseCount++;
                        totalBalance -= tx.amount;
                    }
                }

                // Calculate month-over-month change (simple: compare first half vs second half)
                const midpoint = Math.floor(transactions.length / 2);
                const recentTransactions = transactions.slice(0, midpoint);
                const olderTransactions = transactions.slice(midpoint);

                let recentBalance = 0;
                let olderBalance = 0;

                for (const tx of recentTransactions) {
                    recentBalance += (tx.type === 'income' ? tx.amount : -tx.amount);
                }

                for (const tx of olderTransactions) {
                    olderBalance += (tx.type === 'income' ? tx.amount : -tx.amount);
                }

                const balanceChange = recentBalance - olderBalance;

                return {
                    totalBalance,
                    totalIncome,
                    totalExpense,
                    incomeCount,
                    expenseCount,
                    balanceChange,
                    transactionCount: transactions.length
                };
            }

            formatCurrency(amount, currency = 'USD') {
                const symbol = this.getCurrencySymbol(currency);
                return `${symbol}${Math.abs(amount).toLocaleString('en-US', {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                })}`;
            }

            getCurrencySymbol(currency) {
                const symbols = {
                    'USD': '$',
                    'EUR': '€',
                    'GBP': '£',
                    'JPY': '¥',
                    'CAD': 'C$',
                    'AUD': 'A$',
                    'CHF': 'Fr.',
                    'CNY': '¥'
                };
                return symbols[currency] || currency;
            }

            renderStatistics() {
                const stats = this.calculateStatistics();
                const transactions = this.getTreasuryTransactions();

                if (transactions.length === 0) {
                    return `
                        <div class="empty-state">
                            <div class="empty-icon">💰</div>
                            <div class="empty-title">No Treasury Data Yet</div>
                            <div class="empty-description">
                                Start tracking your treasury by adding the first transaction.
                                Add income and expenses to see statistics here.
                            </div>
                        </div>
                    `;
                }

                const balanceChangeClass = stats.balanceChange > 0 ? 'positive' : stats.balanceChange < 0 ? 'negative' : 'neutral';
                const balanceChangeArrow = stats.balanceChange > 0 ? '↑' : stats.balanceChange < 0 ? '↓' : '→';
                const balanceChangeText = Math.abs(stats.balanceChange).toLocaleString('en-US', {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                });

                return `
                    <div class="header">
                        <div class="title">Treasury Status</div>
                        <div class="subtitle">Financial overview and transaction history</div>
                    </div>

                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-label">Total Balance</div>
                            <div style="display: flex; align-items: baseline; gap: 8px;">
                                <div class="stat-value" style="color: ${stats.totalBalance >= 0 ? '#31A24C' : '#E64C3C'}">
                                    ${this.formatCurrency(stats.totalBalance)}
                                </div>
                            </div>
                            <div class="stat-change ${balanceChangeClass}">
                                <span class="arrow">${balanceChangeArrow}</span>
                                <span>${balanceChangeText}</span>
                            </div>
                        </div>

                        <div class="stat-card">
                            <div class="stat-label">Total Income</div>
                            <div style="display: flex; align-items: baseline; gap: 8px;">
                                <div class="stat-value" style="color: #31A24C">
                                    ${this.formatCurrency(stats.totalIncome)}
                                </div>
                            </div>
                            <div class="stat-change positive">
                                <span class="arrow">↓</span>
                                <span>${stats.incomeCount} transaction${stats.incomeCount !== 1 ? 's' : ''}</span>
                            </div>
                        </div>

                        <div class="stat-card">
                            <div class="stat-label">Total Expenses</div>
                            <div style="display: flex; align-items: baseline; gap: 8px;">
                                <div class="stat-value" style="color: #E64C3C">
                                    ${this.formatCurrency(stats.totalExpense)}
                                </div>
                            </div>
                            <div class="stat-change negative">
                                <span class="arrow">↑</span>
                                <span>${stats.expenseCount} transaction${stats.expenseCount !== 1 ? 's' : ''}</span>
                            </div>
                        </div>
                    </div>

                    ${this.renderRecentTransactions(transactions.slice(0, 10))}
                    ${this.renderAddTransactionForm()}
                `;
            }

            renderRecentTransactions(transactions) {
                if (transactions.length === 0) {
                    return '';
                }

                const transactionsHTML = transactions.map(tx => `
                    <div class="transaction-item">
                        <div class="transaction-left">
                            <div class="transaction-description">${this.escapeHtml(tx.description)}</div>
                            <div class="transaction-meta">
                                ${this.escapeHtml(tx.sender)} • ${this.formatDate(tx.timestamp)} • ${this.escapeHtml(tx.category)}
                            </div>
                        </div>
                        <div class="transaction-amount ${tx.type}">
                            ${tx.type === 'income' ? '+' : '-'}${this.formatCurrency(tx.amount, tx.currency)}
                        </div>
                    </div>
                `).join('');

                return `
                    <div class="transactions-section">
                        <div class="section-title">
                            <span>📋 Recent Transactions</span>
                            <span style="font-size: 12px; color: #A0A9BA; font-weight: 400; margin-left: auto;">
                                Last ${transactions.length} transactions
                            </span>
                        </div>
                        <div class="transactions-list scrollbar">
                            ${transactionsHTML}
                        </div>
                    </div>
                `;
            }

            renderAddTransactionForm() {
                return `
                    <div class="add-transaction-section">
                        <div class="form-title">➕ Add Transaction</div>
                        <form id="transactionForm">
                            <div class="form-group">
                                <label for="description">Description</label>
                                <input
                                    type="text"
                                    id="description"
                                    placeholder="e.g., Office supplies"
                                    required
                                >
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="amount">Amount</label>
                                    <input
                                        type="number"
                                        id="amount"
                                        placeholder="0.00"
                                        step="0.01"
                                        min="0"
                                        required
                                    >
                                </div>
                                <div class="form-group">
                                    <label for="type">Type</label>
                                    <select id="type" required>
                                        <option value="expense">Expense</option>
                                        <option value="income">Income</option>
                                    </select>
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="category">Category</label>
                                    <select id="category" required>
                                        <option value="Other">Other</option>
                                        <option value="Office Supplies">Office Supplies</option>
                                        <option value="Equipment">Equipment</option>
                                        <option value="Travel">Travel</option>
                                        <option value="Utilities">Utilities</option>
                                        <option value="Salaries">Salaries</option>
                                        <option value="Marketing">Marketing</option>
                                        <option value="Grant">Grant</option>
                                        <option value="Donation">Donation</option>
                                        <option value="Investment">Investment</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="currency">Currency</label>
                                    <select id="currency" required>
                                        <option value="USD">USD ($)</option>
                                        <option value="EUR">EUR (€)</option>
                                        <option value="GBP">GBP (£)</option>
                                        <option value="JPY">JPY (¥)</option>
                                        <option value="CAD">CAD (C$)</option>
                                        <option value="AUD">AUD (A$)</option>
                                    </select>
                                </div>
                            </div>

                            ${this.errorMessage ? `<div class="error-message">${this.escapeHtml(this.errorMessage)}</div>` : ''}

                            <button type="submit">Add Transaction</button>
                        </form>
                    </div>
                `;
            }

            formatDate(timestamp) {
                const date = new Date(timestamp);
                const now = new Date();
                const diffMs = now - date;
                const diffMins = Math.floor(diffMs / 60000);
                const diffHours = Math.floor(diffMs / 3600000);
                const diffDays = Math.floor(diffMs / 86400000);

                if (diffMins < 1) return 'just now';
                if (diffMins < 60) return `${diffMins}m ago`;
                if (diffHours < 24) return `${diffHours}h ago`;
                if (diffDays < 7) return `${diffDays}d ago`;

                return date.toLocaleDateString('en-US', {
                    month: 'short',
                    day: 'numeric',
                    year: date.getFullYear() !== now.getFullYear() ? 'numeric' : undefined
                });
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            attachFormHandler() {
                const form = document.getElementById('transactionForm');
                if (!form) return;

                form.addEventListener('submit', (e) => {
                    e.preventDefault();

                    const description = document.getElementById('description').value.trim();
                    const amount = parseFloat(document.getElementById('amount').value);
                    const type = document.getElementById('type').value;
                    const category = document.getElementById('category').value;
                    const currency = document.getElementById('currency').value;

                    if (!description) {
                        this.errorMessage = 'Please enter a description';
                        this.render();
                        return;
                    }

                    if (isNaN(amount) || amount <= 0) {
                        this.errorMessage = 'Please enter a valid amount';
                        this.render();
                        return;
                    }

                    // Send event to parent
                    window.parent.postMessage({
                        type: 'ACTION_SEND_EVENT',
                        eventType: 'io.element.treasury.transaction',
                        content: {
                            description,
                            amount,
                            transactionType: type,
                            category,
                            currency
                        }
                    }, '*');

                    // Reset form
                    form.reset();
                    this.errorMessage = '';
                    this.render();
                });
            }

            render() {
                const app = document.getElementById('app');
                app.innerHTML = this.renderStatistics();
                this.attachFormHandler();
            }
        }

        // Initialize component when DOM is ready
        const component = new TreasuryComponent();
    </script>
</body>
</html>
